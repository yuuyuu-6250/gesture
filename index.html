<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ジェスチャークイズ</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; background-color: #f0f8ff; }
    h1 { font-size: 2.5em; }
    #timer { font-size: 1.5em; margin: 20px 0; }
    #theme { font-size: 2em; margin: 30px auto; padding: 20px; width: 60%; border: 2px solid #444; border-radius: 10px; background-color: #fff; min-height: 80px; transition: box-shadow .2s, border-color .2s; }
    button { font-size: 1.5em; margin: 10px 20px; padding: 15px 40px; border: none; border-radius: 10px; cursor: pointer; }
    .correct { background-color: #4caf50; color: #fff; }
    .pass { background-color: #f44336; color: #fff; }
    #result { font-size: 1.6em; margin-top: 24px; color: #333; min-height: 1.6em; }
    #passInfo { margin-top: 8px; font-size: 1.1em; color: #666; min-height: 1.2em; }
    .bonus3 { border-color: #ff9800; box-shadow: 0 0 0 4px rgba(255,152,0,.2) inset; }
    .bonus2 { border-color: #03a9f4; box-shadow: 0 0 0 4px rgba(3,169,244,.2) inset; }
    #error { color:#b00020; margin-top:10px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>🎭 ジェスチャークイズ 🎭</h1>
  <div id="timer">残り時間: 3:00</div>
  <div id="theme">「スタート」で開始！</div>
  <button id="startBtn">▶ スタート</button>
  <button id="correctBtn" class="correct" disabled>正解！</button>
  <button id="passBtn" class="pass" disabled>パス</button>
  <div id="result"></div>
  <div id="passInfo" aria-live="polite"></div>
  <div id="error"></div>

  <script>
    // ====== お題リスト ======
    const themes = [
    
    ];

    // 🎁 ボーナス設定
    const bonus3 = ["岩田先生","須田先生","渡邊先生","増本先生","徳光先生"]; // 3点
    const bonus2 = []; // 2点（今は未使用）

    // ====== 状態・要素参照 ======
    let remainingThemes = [];
    let correctCount = 0;
    let timeLeft = 120;
    let timerInterval = null;
    let currentTheme = "";

    const themeEl  = document.getElementById('theme');
    const timerEl  = document.getElementById('timer');
    const resultEl = document.getElementById('result');
    const passInfoEl = document.getElementById('passInfo');
    const errorEl  = document.getElementById('error');
    const startBtn   = document.getElementById('startBtn');
    const correctBtn = document.getElementById('correctBtn');
    const passBtn    = document.getElementById('passBtn');

    // ===== パスのクールダウン =====
    const PASS_COOLDOWN = 5; // 秒
    let passReady = true;
    let passCooldownInterval = null;
    let passCooldownRemaining = 0;

    function startPassCooldown() {
      passReady = false;
      passBtn.disabled = true;
      passCooldownRemaining = PASS_COOLDOWN;
      updatePassUI();
      passBtn.textContent = `パス（${passCooldownRemaining}）`;
      if (passCooldownInterval) clearInterval(passCooldownInterval);
      passCooldownInterval = setInterval(() => {
        passCooldownRemaining--;
        if (passCooldownRemaining <= 0) {
          clearInterval(passCooldownInterval);
          passCooldownInterval = null;
          passReady = true;
          passBtn.disabled = false;
          passBtn.textContent = 'パス';
          passInfoEl.textContent = '';
        } else {
          updatePassUI();
          passBtn.textContent = `パス（${passCooldownRemaining}）`;
        }
      }, 1000);
    }
    function resetPassCooldown() {
      if (passCooldownInterval) { clearInterval(passCooldownInterval); passCooldownInterval = null; }
      passReady = true; passBtn.disabled = false; passBtn.textContent = 'パス'; passInfoEl.textContent = '';
    }
    function updatePassUI() { passInfoEl.textContent = `⏳ 次のパスまで ${passCooldownRemaining}秒`; }

    // ===== 正解のクールダウン（1秒・非表示）=====
    const CORRECT_COOLDOWN_MS = 1000;
    let correctReady = true;
    let correctCooldownTimer = null;

    function startCorrectCooldown() {
      correctReady = false;
      correctBtn.disabled = true; // 表示は変えない（非表示の仕様）
      if (correctCooldownTimer) clearTimeout(correctCooldownTimer);
      correctCooldownTimer = setTimeout(() => {
        correctReady = true;
        correctBtn.disabled = false;
        correctCooldownTimer = null;
      }, CORRECT_COOLDOWN_MS);
    }
    function resetCorrectCooldown() {
      if (correctCooldownTimer) { clearTimeout(correctCooldownTimer); correctCooldownTimer = null; }
      correctReady = true; correctBtn.disabled = false;
    }

    // 例外表示
    window.onerror = function(msg, src, line, col) { errorEl.textContent = `エラー: ${msg} @${line}:${col}`; };

    function updateTimer() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerEl.textContent = `残り時間: ${minutes}:${seconds.toString().padStart(2, '0')}`;
    }

    function startGame() {
      try {
        correctCount = 0;
        timeLeft = 180;
        remainingThemes = [...themes];
        resultEl.textContent = '';
        errorEl.textContent  = '';
        startBtn.disabled = true;
        resetPassCooldown();
        resetCorrectCooldown();
        nextTheme();
        updateTimer();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          timeLeft--;
          updateTimer();
          if (timeLeft <= 0) { clearInterval(timerInterval); endGame(); }
        }, 1000);
      } catch (e) { errorEl.textContent = `エラー: ${e.message}`; }
    }

    function nextTheme() {
      if (remainingThemes.length === 0) {
        themeEl.classList.remove('bonus3','bonus2');
        themeEl.textContent = "🎉 全てのお題を出し切りました！";
        return;
      }
      const index = Math.floor(Math.random() * remainingThemes.length);
      currentTheme = remainingThemes.splice(index, 1)[0];
      themeEl.classList.remove('bonus3','bonus2');
      if (bonus3.includes(currentTheme)) {
        themeEl.textContent = currentTheme + " 🎁 ボーナス問題！（3点）";
        themeEl.classList.add('bonus3');
      } else if (bonus2.includes(currentTheme)) {
        themeEl.textContent = currentTheme + " 🎁 ボーナス問題！（2点）";
        themeEl.classList.add('bonus2');
      } else {
        themeEl.textContent = currentTheme;
      }
      // ゲーム中はボタンを操作可能に
      correctBtn.disabled = !correctReady;
      passBtn.disabled = !passReady;
    }

    function correctAnswer() {
      if (!correctReady) return; // 連打防止
      if (bonus3.includes(currentTheme))      correctCount += 3;
      else if (bonus2.includes(currentTheme)) correctCount += 2;
      else                                     correctCount += 1;
      startCorrectCooldown(); // 1秒クールダウン開始（非表示）
      nextTheme();
    }

    function passTheme() {
      if (!passReady) return;
      nextTheme();
      startPassCooldown();
    }

    function endGame() {
      themeEl.classList.remove('bonus3','bonus2');
      themeEl.textContent = 'タイムアップ！';
      resultEl.textContent = `✅ 得点: ${correctCount}点`;
      startBtn.disabled = false;
      correctBtn.disabled = true;
      passBtn.disabled = true;
      resetPassCooldown();
      resetCorrectCooldown();
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    // イベント登録
    startBtn.addEventListener('click', startGame);
    correctBtn.addEventListener('click', correctAnswer);
    passBtn.addEventListener('click', passTheme);
  </script>
</body>
</html>
