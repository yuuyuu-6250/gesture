<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ジェスチャークイズ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🎭 ジェスチャークイズ 🎭</h1>
  <div id="timer">残り時間: 2:00</div>
  <div id="theme">「スタート」で開始！</div>
  <button id="startBtn">▶ スタート</button>
  <button id="correctBtn" class="correct" disabled>正解！</button>

  <div id="result"></div>
  <div id="passInfo" aria-live="polite"></div>
  <div id="error"></div>
  <script src="quiz.js"></script>
</body>
</html>
